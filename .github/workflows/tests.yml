# Run the test suite on every push and pull request.
# The tests use fakes for Groq, GitHub, NYC Open Data and Tavily, so
# they need no API keys.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # The retrieval tests use Chroma's embedding model, which is
      # downloaded on first use; keep it between runs.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: chroma-embedding-model

      - name: Run tests
        run: python -m pytest -q
